# Squash merges use the PR title as the commit message, and release.yml reads its type, so the
# title must be a Conventional Commit. No third-party action: the title goes in through env.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert|content)(\([^)]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be a Conventional Commit, for example 'fix(transition): handle skipped transitions'. Got: $TITLE"
            exit 1
          fi
